<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
<style>
body { background:white; font-family:Arial; }
h1 { text-align:center; color:blue; }
table { margin:auto; padding:10px; border:2px solid blue; }
td { padding:8px; }
input, select, textarea { background:white; }
</style>
</head>
<body>
<h1>REGISTRATION FORM</h1>
<form name="registration" method="post" onsubmit="return validate()">
<table>

<tr><td><label for="username">Username:</label></td><td><input type="text" id="username" name="username"></td></tr>
<tr><td><label for="password">Password:</label></td><td><input type="password" id="password" name="password"></td></tr>
<tr><td><label for="confirm">Confirm Password:</label></td><td><input type="password" id="confirm" name="confirm"></td></tr>
<tr><td><label for="email">Email:</label></td><td><input type="email" id="email" name="email"></td></tr>
<tr><td><label for="phone">Phone:</label></td><td><input type="tel" id="phone" name="phone"></td></tr>
<tr><td><label for="dob">DOB:</label></td><td><input type="date" id="dob" name="dob"></td></tr>
<tr><td><label for="address">Address:</label></td><td><textarea id="address" name="address" rows="3" cols="20"></textarea></td></tr>
<tr><td>Gender:</td><td><label><input type="radio" name="gender" value="Male">Male</label>
  <label><input type="radio" name="gender" value="Female">Female</label></td></tr>

<tr><td><input type="reset" value="CLEAR"></td><td><input type="submit" value="REGISTER"></td></tr>
</table>
</form>
<script>
function validate() {
    var f = document.forms["registration"];
    if (!/\S/.test(f.elements["username"].value)) {
        alert("Enter username"); return false;
    }
    if (!/\S/.test(f.elements["password"].value)) {
        alert("Enter password"); return false;
    }
    if (f.elements["password"].value !== f.elements["confirm"].value) {
        alert("Passwords do not match"); return false;
    }
    if (!/^[0-9]{10}$/.test(f.elements["phone"].value)) {
        alert("Enter valid mobile number"); return false;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.elements["email"].value)) {
        alert("Enter valid email"); return false;
    }
    if (f.elements["dob"].value === "" || f.elements["gender"].value === ""|| !/\S/.test(f.elements["address"].value)) {
        alert("Fill all fields"); return false;
    }
    return true;
}
</script>
</body>
</html>
