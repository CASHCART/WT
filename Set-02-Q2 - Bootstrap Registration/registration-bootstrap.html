<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
body { background:blanchedalmond; }
</style>
</head>
<body>
<main class="container py-4">
<div class="card shadow mx-auto" style="max-width:500px">
<div class="card-body">
<h1 class="text-center mb-4 h3">Registration Form</h1>
<form name="registration" onsubmit="return validate()">
<div class="mb-3"><label for="username" class="form-label">Username</label>
  <input type="text" id="username" name="username" class="form-control" required></div>
<div class="mb-3"><label for="email" class="form-label">Email</label>
  <input type="email" id="email" name="email" class="form-control" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label>
  <input type="password" id="password" name="password" class="form-control" required></div>
<div class="mb-3"><label for="confirm" class="form-label">Confirm Password</label>
  <input type="password" id="confirm" name="confirm" class="form-control" required></div>
<div class="mb-3"><label for="phone" class="form-label">Mobile Number</label>
  <input type="tel" id="phone" name="phone" class="form-control" pattern="[0-9]{10}" required></div>
<div class="mb-3"><label for="dob" class="form-label">Date of Birth</label>
  <input type="date" id="dob" name="dob" class="form-control" required></div>
<div class="mb-3"><label for="gender" class="form-label">Gender</label>
  <select id="gender" name="gender" class="form-select" required>
    <option value="">Choose</option><option>Male</option><option>Female</option></select></div>
<div class="mb-3"><label for="address" class="form-label">Address</label>
  <textarea id="address" name="address" class="form-control" rows="3" required></textarea></div>
<div class="d-flex justify-content-between"><button type="submit" class="btn btn-success">Register</button>
  <button type="reset" class="btn btn-secondary">Clear</button></div>
</form>
</div>
</div>
</main>
<script>
function validate() {
    var f = document.forms["registration"];
    if (f.elements["password"].value !== f.elements["confirm"].value) {
        alert("Passwords do not match"); return false;
    }
    return true;
}
</script>
</body>
</html>
